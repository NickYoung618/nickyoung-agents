<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NickYoung · 尼克杨助手</title><link rel="stylesheet" href="/style.css"><body><div class="shell"><aside class="sidebar"><div class="brand">NickYoung<span>尼克杨助手</span></div><button id="new">＋ 新对话</button><nav id="conversations"></nav><button id="settings">设置</button></aside><main><header><button id="toggleLeft" aria-label="收起对话列表">☰</button><div id="heading">新的想法，从这里开始<span>尼克杨先生的工作助手</span></div><button id="pause" hidden>暂停</button><button id="toggleRight" aria-label="收起团队">团队</button></header><section id="messages"><div class="welcome"><div class="monogram">N</div><h1>把想法，交给团队。</h1><p>描述你想完成的事，知行会组织成员一起推进。</p></div></section><div id="questions"></div><form id="composer"><textarea id="input" rows="2" placeholder="说说你想做什么…" aria-label="需求"></textarea><div class="composebar"><input id="path" placeholder="项目位置 · 留空新建项目" aria-label="项目目录"><button class="primary">发送 ↑</button></div></form><div id="notice" role="status"></div></main><aside class="inspector"><div class="tabs"><button data-tab="team">团队</button><button data-tab="graph">协作</button><button data-tab="changes">改动</button></div><section id="panel"></section></aside></div><dialog id="settingsDialog"><form method="dialog"><button class="close">关闭</button></form><h2>设置</h2><p class="muted">模型 · 更改后先测试，再保存</p><div id="modelSettings"></div><button id="addTier">＋ 新增档位</button><label>并发成员数<input id="concurrency" type="number" min="1" max="5"></label><label>回合时限（分钟）<input id="timeout" type="number" min="1"></label><label>成员名单<input id="names"></label><label>经验<textarea id="experience" rows="5"></textarea></label><button id="saveSettings" class="primary">保存设置</button><p id="settingsResult" role="status"></p><details><summary>表现</summary><div id="stats"></div></details><details><summary>账户</summary><input id="newPassword" type="password" placeholder="新口令，至少 12 字符"><button id="changePassword">更改口令</button><button id="logout">退出登录</button></details></dialog><script type="module" src="/app.js"></script></body></html>
